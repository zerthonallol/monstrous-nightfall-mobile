name: Bundle TanStack Start Lovable Project to Single HTML

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Version 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --include=dev

      - name: Build and Bundle Project
        run: |
          # Устанавливаем плагин singlefile
          npm install --save-dev vite-plugin-singlefile

          # Для TanStack Start стандартный vite build может требовать специфичную команду сборки
          # Пробуем стандартный билд проекта, который прописан в package.json, либо через vite
          if grep -q "\"build\"" package.json; then
            npm run build
          else
            npx vite build
          fi

          # Выведем список файлов после сборки, чтобы найти куда сохранился результат
          echo "=== Корневая директория после сборки ==="
          ls -la
          find . -maxdepth 3 -not -path '*/.*' -not -path './node_modules*'
