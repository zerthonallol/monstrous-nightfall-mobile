name: Bundle Lovable Project to Single HTML

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --include=dev

      - name: Force Fix Vite Config & Build
        run: |
          # Устанавливаем плагин singlefile
          npm install --save-dev vite-plugin-singlefile

          # Полностью перезаписываем vite.config.ts, чтобы он точно собирал всё в один файл и в папку dist
          cat << 'EOF' > vite.config.ts
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import { viteSingleFile } from 'vite-plugin-singlefile';

          export default defineConfig({
            plugins: [react(), viteSingleFile()],
            build: {
              outDir: 'dist',
              emptyOutDir: true,
            }
          });
          EOF

          # Запускаем сборку
          npx vite build

          # Проверим, что создалось в проекте после сборки
          echo "=== Содержимое корня ==="
          ls -la
          echo "=== Содержимое dist ==="
          ls -la dist || echo "Папка dist не найдена!"

      - name: Upload Single HTML File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: single-lovable-game
          path: |
            dist/*.html
            *.html
