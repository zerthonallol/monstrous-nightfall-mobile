name: Ultimate Single HTML Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Version 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --legacy-peer-deps

      - name: Build Project
        run: |
          # Запускаем стандартную сборку проекта
          if grep -q "\"build\"" package.json; then
            npm run build
          else
            npx vite build
          fi

      - name: Pack Everything into Single HTML via html-inline
        run: |
          # Устанавливаем инлайнер глобально
          npm install -g html-inline

          # Ищем сгенерированный html файл (в dist, .output или корне)
          HTML_FILE=$(find . -name "*.html" -not -path "./node_modules*" | head -n 1)
          
          if [ -n "$HTML_FILE" ]; then
            echo "Found HTML entry: $HTML_FILE"
            html-inline "$HTML_FILE" > final-game.html
          else
            echo "HTML not found, creating fallback..."
            echo "<html><body><h1>Build failed to produce HTML</h1></body></html>" > final-game.html
          fi

          ls -la final-game.html

      - name: Upload Single HTML File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-single-html-game
          path: final-game.html
