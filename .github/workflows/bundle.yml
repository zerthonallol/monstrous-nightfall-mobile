name: Ultimate TanStack SPA Single HTML

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Version 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --legacy-peer-deps

      - name: Auto-detect Entry Point & Build Single HTML
        run: |
          npm install --save-dev vite-plugin-singlefile --legacy-peer-deps

          # Ищем реальный файл клиента в проекте (client.tsx, main.tsx, index.tsx и т.д.)
          ENTRY_FILE=$(find src app -name "client.tsx" -o -name "main.tsx" -o -name "index.tsx" 2>/dev/null | head -n 1)
          
          if [ -z "$ENTRY_FILE" ]; then
            # Если не нашли в src/app, ищем вообще любой .tsx/.ts в корне или папках
            ENTRY_FILE=$(find . -maxdepth 3 -name "*.tsx" -not -path "./node_modules*" | head -n 1)
          fi

          echo "Найден файл точки входа: $ENTRY_FILE"

          # Убираем ведущую точку, если она есть (например ./src/client.tsx -> /src/client.tsx)
          ENTRY_FILE_CLEAN=$(echo "$ENTRY_FILE" | sed 's/^\./\./')

          # Создаем корректный index.html с найденным файлом
          cat << EOF > index.html
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Game</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="$ENTRY_FILE_CLEAN"></script>
            </body>
          </html>
          EOF

          # Перезаписываем vite.config.ts
          cat << 'EOF' > vite.config.ts
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import { viteSingleFile } from 'vite-plugin-singlefile';

          export default defineConfig({
            plugins: [
              react(),
              viteSingleFile()
            ],
            build: {
              target: 'esnext',
              outDir: 'dist',
              emptyOutDir: true,
            },
          });
          EOF

          # Удаляем конфиги SSR
          rm -f app.config.ts nitro.config.ts

          # Сборка
          npx vite build

          echo "=== Содержимое dist ==="
          ls -la dist || echo "Папка dist пуста!"

      - name: Upload Single HTML File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: single-html-game
          path: dist/*.html
