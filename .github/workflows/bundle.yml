name: Bundle Lovable Project to Single HTML

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --include=dev

      - name: Build Single HTML with Vite Plugin
        run: |
          # Устанавливаем плагин для упаковки всего в один файл
          npm install --save-dev vite-plugin-singlefile

          # Проверяем наличие vite.config.ts / vite.config.js и добавляем плагин в конфиг, если его там нет
          if [ -f vite.config.ts ]; then
            CONFIG_FILE="vite.config.ts"
          elif [ -f vite.config.js ]; then
            CONFIG_FILE="vite.config.js"
          else
            CONFIG_FILE="vite.config.ts"
            echo "import { defineConfig } from 'vite'; import react from '@vitejs/plugin-react'; import { viteSingleFile } from 'vite-plugin-singlefile'; export default defineConfig({ plugins: [react(), viteSingleFile()] });" > $CONFIG_FILE
          fi

          # Запускаем сборку проекта
          npx vite build

      - name: Upload Single HTML File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: single-lovable-game
          path: dist/*.html
