name: Ultimate TanStack SPA Single HTML

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Version 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --legacy-peer-deps

      - name: Create index.html & Force Static SPA Build
        run: |
          npm install --save-dev vite-plugin-singlefile --legacy-peer-deps

          # Создаем классический index.html в корне, если его там нет, чтобы Vite не ругался на входную точку
          if [ ! -f index.html ]; then
            cat << 'EOF' > index.html
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Game</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/app/client.tsx"></script>
            </body>
          </html>
          EOF
          fi

          # Перезаписываем vite.config.ts для чистой сборки в один файл
          cat << 'EOF' > vite.config.ts
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import { viteSingleFile } from 'vite-plugin-singlefile';

          export default defineConfig({
            plugins: [
              react(),
              viteSingleFile()
            ],
            build: {
              target: 'esnext',
              outDir: 'dist',
              emptyOutDir: true,
            },
          });
          EOF

          # Удаляем конфигурации SSR, чтобы сборка шла как чистое SPA
          rm -f app.config.ts nitro.config.ts

          # Запуск сборки
          npx vite build

          echo "=== Содержимое dist ==="
          ls -la dist || echo "Папка dist пуста!"

      - name: Upload Single HTML File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: single-html-game
          path: dist/*.html
