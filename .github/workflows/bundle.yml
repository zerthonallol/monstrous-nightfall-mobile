name: Ultimate Bundle Fix

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Version 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean npm cache and reinstall (Fixes edgesOut crash)
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --legacy-peer-deps

      - name: Install SingleFile Plugin & Build
        run: |
          npm install --save-dev vite-plugin-singlefile --legacy-peer-deps
          
          # Запускаем сборку через npm run build (если она есть) или напрямую vite
          if grep -q "\"build\"" package.json; then
            npm run build
          else
            npx vite build
          fi

          echo "=== Проверяем, что создалось ==="
          ls -la
          ls -la dist || ls -la build || echo "Ищем папки сборки..."

      - name: Upload Single HTML File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: single-html-game
          path: |
            dist/*.html
            build/*.html
            *.html
