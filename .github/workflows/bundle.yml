name: Ultimate TanStack SPA Single HTML

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Version 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --legacy-peer-deps

      - name: Install SingleFile Plugin & Force Static SPA Build
        run: |
          npm install --save-dev vite-plugin-singlefile --legacy-peer-deps

          # Перезаписываем vite.config.ts, чтобы принудительно убрать SSR/Nitro и включить singlefile
          cat << 'EOF' > vite.config.ts
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import { viteSingleFile } from 'vite-plugin-singlefile';
          import tsconfigPaths from 'vite-tsconfig-paths';

          export default defineConfig({
            plugins: [
              react(),
              tsconfigPaths(),
              viteSingleFile()
            ],
            build: {
              target: 'esnext',
              assetsInlineLimit: 100000000, // Инлайним всё, включая текстуры и модели если они встроены
              chunkSizeWarningLimit: 2000,
              outDir: 'dist',
              emptyOutDir: true,
            },
          });
          EOF

          # Удаляем конфиги Nitro/TanStack Start, если они мешают чистой статической сборке
          rm -f app.config.ts nitro.config.ts

          # Запускаем чистый сборщик Vite
          npx vite build

          echo "=== Проверяем папку dist ==="
          ls -la dist || echo "dist не найдена!"

      - name: Upload Single HTML File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: single-html-game
          path: dist/*.html
